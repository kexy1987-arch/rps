<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock, Paper, Scissor</h1>
    <div id ="game-container">
        <div id="score-board">
            <p>Player's Score:<span id=player-score>0</span></p>
            <p>Computer's Score:<span id=computer-score>0</span></p>
        </div>
        <div id="picked-container">
            <div id="player-choice" class="picked">
                <img src="./assets/rock.png" alt="rock" />
            </div>
            <div id="computer-choice" class="picked">
                <img src="./assets/rock.png" alt="rock" />
            </div>
        </div>
        <div id="choices-container">
            <div class="choice">
                <img src="./assets/rock.png" alt="rock"/>
            </div>
            <div class="choice">
                <img src="./assets/paper.webp" alt="paper"/>
            </div>
            <div class="choice">
                <img src="./assets/scissor.png" alt="scissors"/>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
