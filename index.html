            </div>
            <div id="computer-choice" class="picked">
                <img src="https://www.bing.com/ck/a?!&&p=0c9d4766c135aaad7db37b583797a4f892a9cc38fe86ec2d2416c6925dd4c6d8JmltdHM9MTc3ODExMjAwMA&ptn=3&ver=2&hsh=4&fclid=18162f0f-a237-641e-3c4c-395ca30965f0&u=a1L2ltYWdlcy9zZWFyY2g_cT1yb2NrK2NhcnRvb24raW1nJmlkPTM1NTU5NDFFNDVCMDcxOTY1RUFEMEY0NUU3REU1Mzc3RUI5OEQ4ODMmRk9STT1JUUZSQkE" alt="" />
            </div>
        </div>
        <div id="choices-container">
            <div class="choice">
                <img src="https://static.vecteezy.com/system/resources/previews/050/740/253/large_2x/cute-smiling-rock-cartoon-illustration-vector.jpg" alt="rock"/>
            </div>
            <div class="choice">
                <img src="https://img.freepik.com/premium-vector/hand-drawn-paper-cartoon-illustration_23-2151474661.jpg?w=2000" alt="paper"/>
            </div>
            <div class="choice">
                <img src="https://img.freepik.com/premium-vector/hand-drawn-scissors-cartoon-illustration_23-2151388093.jpg?w=2000" alt="scissors"/>
            </div>
        </div>
